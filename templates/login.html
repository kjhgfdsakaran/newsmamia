<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body style="display:grid;place-items:center;height:100vh">

<div style="background:var(--card);padding:30px;border-radius:12px;width:300px;text-align:center">

  <h2>NewsMania</h2>
  <p style="color:var(--muted)">Enter your name</p>

  <form method="POST">
    <input type="text" name="username" placeholder="Your name" required style="width:100%;padding:10px;margin:10px 0">
    <button style="width:100%;padding:10px;background:var(--pri);color:#fff;border:none;border-radius:8px">Login</button>
  </form>

  <form method="POST">
    <input type="hidden" name="username" value="Guest">
    <button style="width:100%;margin-top:10px;padding:10px;border:1px solid var(--border);background:none;border-radius:8px">Guest</button>
  </form>

</div>

</body>
</html>
